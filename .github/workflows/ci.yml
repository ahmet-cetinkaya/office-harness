# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The version must match rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Probe the batch stop test
        run: |
          fails=0
          for i in $(seq 1 50); do
            echo "=== RUN $i ==="
            if ! cargo test -p office-harnessd --test sessions_windows -- --nocapture > "run-$i.log" 2>&1; then
              fails=$((fails+1)); echo "RUN $i FAILED"; cat "run-$i.log" | grep -E "probe|panicked|test result" | head -80
            else
              echo "RUN $i ok"
            fi
          done
          echo "FAILS=$fails of 50"
          echo "=== one passing run for comparison ==="
          grep -E "probe" run-1.log | head -60
