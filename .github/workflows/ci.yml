# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux system packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # The version must match rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Flake probe
        run: |
          set -u
          mkdir -p probe-logs
          # CPU load so the two start answers of the codex test can finish
          # out of order, and so the shell can be parked inside the args-file
          # window of the portable test.
          for j in 1 2; do (while :; do :; done) & done
          LOAD_PIDS=$(jobs -p)
          worker() {
            local w=$1 i
            for i in $(seq 1 10); do
              for t in sessions sessions_portable; do
                cargo test -p office-harnessd --test $t -- --nocapture \
                  > "probe-logs/w$w-$t-$i.log" 2>&1 \
                  && echo "w$w $t $i ok" \
                  || echo "w$w $t $i FAILED"
              done
            done
            echo "worker $w done"
          }
          # Kill the load first, so wait returns when the workers end.
          ( for w in 1 2 3 4; do worker "$w" & done; wait ) &
          WORKERS=$!
          wait "$WORKERS"
          kill $LOAD_PIDS 2>/dev/null || true
          fails=$(grep -l "panicked" probe-logs/*.log 2>/dev/null | wc -l | tr -d ' ')
          runs=$(ls probe-logs/*.log | wc -l | tr -d ' ')
          echo "TOTAL FAILURES: $fails / $runs"
          for f in $(grep -l "panicked" probe-logs/*.log 2>/dev/null); do
            echo "=== $f ==="; grep -B2 -A10 "panicked" "$f" | head -40
          done
          [ "$fails" -eq 0 ]
