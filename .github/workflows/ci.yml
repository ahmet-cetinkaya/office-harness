# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux system packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # The version must match rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Flake probe
        run: |
          set -u
          mkdir -p probe-logs
          fails=0
          for i in $(seq 1 40); do
            cargo test -p office-harnessd --test sessions_portable -- --nocapture \
              > "probe-logs/run-$i.log" 2>&1 || { fails=$((fails+1)); echo "RUN $i FAILED"; }
            tail -3 "probe-logs/run-$i.log" | sed "s/^/run $i: /"
          done
          echo "TOTAL FAILURES: $fails / 40"
          grep -l "FAILED\|panicked" probe-logs/*.log || true
          for f in $(grep -l "panicked" probe-logs/*.log 2>/dev/null); do
            echo "=== $f ==="; grep -A6 "panicked" "$f" | head -30
          done
          [ "$fails" -eq 0 ]

      - name: Tauri build
        working-directory: src/apps/desktop
        run: bun run tauri build --no-bundle
