# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Linux system packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # The version must match rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # bun installs and runs scripts; tools with a `node` shebang run on this pinned Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # Tauri checks that the sidecar exists, so it is built before any clippy or Tauri run.
      - name: Prepare sidecar
        working-directory: src/apps/desktop
        run: bun scripts/prepare-sidecar.ts

      - name: Rust format and lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace

      - name: Boundaries
        run: |
          scripts/check-boundaries.sh --self-test
          scripts/check-boundaries.sh

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile

      - name: Webview lint
        working-directory: src/apps/desktop
        run: |
          bun run check
          bun run lint
          bun run format:check

      - name: Webview tests
        working-directory: src/apps/desktop
        run: bun test src

      - name: Playwright
        working-directory: src/apps/desktop
        run: |
          bunx playwright install --with-deps chromium
          bun run e2e

      - name: Tauri build
        working-directory: src/apps/desktop
        run: bun run tauri build --no-bundle
