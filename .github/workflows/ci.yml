# SPDX-License-Identifier: AGPL-3.0-or-later
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'specs/**'
      - 'docs/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'specs/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pull request runs only the steps that its changed files can affect.
      # A push to main runs every step, so main is always fully checked.
      - name: Find the changed areas
        id: changes
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")"
          echo "$changed"
          rust=false
          web=false
          # The workflow file itself counts for both areas.
          if echo "$changed" | grep -qE '(\.rs|Cargo\.toml|Cargo\.lock|rust-toolchain\.toml)$|^scripts/|^src/apps/desktop/(src-tauri/|scripts/)|^\.github/workflows/ci\.yml$'; then rust=true; fi
          if echo "$changed" | grep -qE '^src/apps/desktop/|^(package\.json|bun\.lock)$|^\.github/workflows/ci\.yml$'; then web=true; fi
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"

      - name: Install Linux system packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      # The version must match rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # bun installs and runs scripts; tools with a `node` shebang run on this pinned Node.
      # macOS and Windows run the Rust tests only (owner decision).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: runner.os == 'Linux'
        with:
          node-version: 24

      # Tauri checks that the sidecar exists, so it is built before any clippy or Tauri run.
      - name: Prepare sidecar
        if: steps.changes.outputs.rust == 'true' || steps.changes.outputs.web == 'true'
        working-directory: src/apps/desktop
        run: bun scripts/prepare-sidecar.ts

      - name: Rust format and lint
        if: runner.os == 'Linux' && steps.changes.outputs.rust == 'true'
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --workspace

      - name: Boundaries
        if: runner.os == 'Linux' && steps.changes.outputs.rust == 'true'
        run: |
          scripts/check-boundaries.sh --self-test
          scripts/check-boundaries.sh

      - name: Install JavaScript dependencies
        if: runner.os == 'Linux' && (steps.changes.outputs.rust == 'true' || steps.changes.outputs.web == 'true')
        run: bun install --frozen-lockfile

      - name: Webview lint
        if: runner.os == 'Linux' && steps.changes.outputs.web == 'true'
        working-directory: src/apps/desktop
        run: |
          bun run check
          bun run lint
          bun run format:check

      - name: Webview tests
        if: runner.os == 'Linux' && steps.changes.outputs.web == 'true'
        working-directory: src/apps/desktop
        run: bun test src

      - name: Playwright
        if: runner.os == 'Linux' && steps.changes.outputs.web == 'true'
        working-directory: src/apps/desktop
        run: |
          bunx playwright install --with-deps chromium
          bun run e2e

      - name: Tauri build
        if: runner.os == 'Linux' && (steps.changes.outputs.rust == 'true' || steps.changes.outputs.web == 'true')
        working-directory: src/apps/desktop
        run: bun run tauri build --no-bundle
