# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "private-fs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Owner-only files on Windows need Windows API calls, so this crate may use
# unsafe code where it says why. The other workspace lints apply unchanged.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"

[dev-dependencies]
tempfile.workspace = true
