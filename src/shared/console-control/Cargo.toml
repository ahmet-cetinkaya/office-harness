# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "console-control"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Turning the interrupt key back on for the server's children on Windows needs
# one Windows API call, so this crate may use unsafe code where it says why.
# The other workspace lints apply unchanged.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
