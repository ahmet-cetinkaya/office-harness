[package]
name = "office-harnessd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
access-application = { path = "../../modules/access/application" }
access-infrastructure = { path = "../../modules/access/infrastructure" }
access-presentation = { path = "../../modules/access/presentation" }
agent-application = { path = "../../modules/agent/application" }
agent-domain = { path = "../../modules/agent/domain" }
agent-infrastructure = { path = "../../modules/agent/infrastructure" }
agent-presentation = { path = "../../modules/agent/presentation" }
hierarchy-application = { path = "../../modules/hierarchy/application" }
hierarchy-domain = { path = "../../modules/hierarchy/domain" }
hierarchy-infrastructure = { path = "../../modules/hierarchy/infrastructure" }
hierarchy-presentation = { path = "../../modules/hierarchy/presentation" }
audit-application = { path = "../../modules/audit/application" }
audit-domain = { path = "../../modules/audit/domain" }
audit-infrastructure = { path = "../../modules/audit/infrastructure" }
audit-presentation = { path = "../../modules/audit/presentation" }
notification-application = { path = "../../modules/notification/application" }
notification-domain = { path = "../../modules/notification/domain" }
notification-infrastructure = { path = "../../modules/notification/infrastructure" }
notification-presentation = { path = "../../modules/notification/presentation" }
secret-application = { path = "../../modules/secret/application" }
secret-domain = { path = "../../modules/secret/domain" }
secret-infrastructure = { path = "../../modules/secret/infrastructure" }
secret-presentation = { path = "../../modules/secret/presentation" }
template-application = { path = "../../modules/template/application" }
template-domain = { path = "../../modules/template/domain" }
template-infrastructure = { path = "../../modules/template/infrastructure" }
template-presentation = { path = "../../modules/template/presentation" }
auto-launch.workspace = true
axum.workspace = true
directories.workspace = true
gethostname.workspace = true
kernel = { path = "../../kernel" }
private-fs = { path = "../../shared/private-fs" }
console-control = { path = "../../shared/console-control" }
rusqlite.workspace = true
serde.workspace = true
# The journal's cap names an over-long directive text by its hash.
sha2.workspace = true
serde_json.workspace = true
terminal-application = { path = "../../modules/terminal/application" }
terminal-domain = { path = "../../modules/terminal/domain" }
terminal-infrastructure = { path = "../../modules/terminal/infrastructure" }
terminal-presentation = { path = "../../modules/terminal/presentation" }
thiserror.workspace = true
tokio.workspace = true
# The agent-call helper is a WebSocket client of the loopback server.
futures-util.workspace = true
tokio-tungstenite.workspace = true
wire = { path = "../../shared/wire" }

# The server asks the OS for no memory dump (0026/FR-013), through nix's safe
# wrappers.
[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["resource", "process"] }

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true

[lints]
workspace = true
