# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "src/kernel",
    "src/shared/*",
    "src/modules/*/domain",
    "src/modules/*/application",
    "src/modules/*/infrastructure",
    "src/modules/*/presentation",
    "src/apps/office-harnessd",
    "src/apps/desktop/src-tauri",
]
default-members = ["src/apps/office-harnessd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
rusqlite = { version = "=0.43.0", features = ["bundled"] }
serde_json = "1"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
hmac = "=0.13.0"
sha2 = "=0.11.1"
hex = "0.4"
getrandom = "0.4"
tokio-tungstenite = "=0.29.0"
futures-util = "0.3"
tower = { version = "0.5", default-features = false, features = ["util"] }
directories = "=6.0.0"
gethostname = "1"
tempfile = "3"
portable-pty = "=0.9.0"
vt100 = "=0.18.1"
base64 = "0.22"
# Safe signal and account wrappers; the version matches the one portable-pty uses.
nix = { version = "0.28", default-features = false }
tauri = { version = "=2.12.5", features = [] }
tauri-build = "=2.7.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
